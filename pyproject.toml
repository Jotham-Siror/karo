[project]
name = "karo"
version = "0.1.0"
description = "Karo: an AI money agent that pays school fees across borders, with every money rule enforced in code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.15.0",
    "apscheduler>=3.10,<4",
    "argon2-cffi>=25.1.0",
    "babel>=2.16",
    "fastapi>=0.146.0",
    "httpx>=0.27",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "phonenumbers>=9.0.41",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.32",
    "twilio>=9.12.0",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.23.1",
    "time-machine>=3.5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
